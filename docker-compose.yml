services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medfin-data-cloud-app
    env_file:
      - .env.docker
    ports:
      - "3010:3000"
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run start"

  mysql:
    image: mysql:8.4
    container_name: medfin-data-cloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: datacloud
      MYSQL_USER: datacloud
      MYSQL_PASSWORD: datacloud
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
